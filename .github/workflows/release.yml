# Publicación: al subir una etiqueta vX.Y.Z se arma el portable y se publica una versión en GitHub con las notas
# de CHANGELOG.md. La aplicación consulta esa versión para avisar que hay una nueva (gml.releases en package.json).
name: Publicar versión

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: La etiqueta coincide con package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package
      - name: Notas de la versión
        shell: bash
        run: node tools/release-notes.mjs "${GITHUB_REF_NAME}" > notas.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Games Meta Launcher ${{ github.ref_name }}
          body_path: notas.md
          files: releases/*.exe
