<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Games Meta Launcher</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main>
    <header class="hero"><div><p class="eyebrow">PLAYER ONE · BIBLIOTECA LOCAL</p><h1>GAMES<br><span>META LAUNCHER</span></h1><p id="last-update">Cargando inventario…</p></div><div class="coin" aria-hidden="true">★</div></header>
    <section class="command-bar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar juego…"></label><button id="refresh" class="button primary">↻ Actualizar ahora</button></section>
    <section class="filters"><h2>Filtros</h2><div id="platforms" class="chips"></div><select id="drive"><option value="">Todas las unidades</option></select><select id="sort"><option value="name">Nombre (A–Z)</option><option value="platform">Plataforma</option><option value="drive">Unidad</option></select></section>
    <p id="counter" class="counter"></p><section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <template id="card-template"><article class="game-card"><div class="pixel-art">🎮</div><div class="card-main"><p class="platform"></p><h3></h3><p class="location"></p><p class="evidence"></p></div><button class="button play">▶ Jugar</button></article></template>
  <dialog id="notice"><p></p><button class="button primary">Entendido</button></dialog><script src="/app.js"></script>
</body></html>
