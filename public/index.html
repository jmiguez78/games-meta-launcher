<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Games Meta Launcher</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/overrides.css"></head>
<body>
  <main>
    <header class="hero"><div><p class="eyebrow">PLAYER ONE · BIBLIOTECA LOCAL</p><h1>GAMES<br><span>META LAUNCHER</span></h1><p id="last-update">Cargando inventario…</p></div><div class="coin" aria-hidden="true">★</div></header>
    <section class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar juego, etiqueta o plataforma…"></label><button id="refresh" class="button primary">Actualizar</button><button id="export-preferences" class="button">Respaldar</button><label class="button import-button">Restaurar<input id="import-preferences" type="file" accept="application/json" hidden></label><div id="views" class="view-switch" aria-label="Vista"><button data-view="explorer" title="Explorador">▤</button><button data-view="detail" title="Detalle">▥</button><button data-view="list" title="Lista">☷</button><button data-view="icons" class="active" title="Iconos grandes">▦</button></div></section>
    <section class="filter-panel"><div class="filter-heading"><h2>Filtros</h2><button id="clear-filters" class="link-button">Limpiar</button></div><div id="platforms" class="chips"></div><div class="filter-row"><div id="statuses" class="chips"></div><label class="check"><input id="favorites-only" type="checkbox"> Favoritos</label><select id="tag"><option value="">Todas las etiquetas</option></select><select id="drive"><option value="">Todas las unidades</option></select><select id="sort"><option value="name">Nombre (A–Z)</option><option value="platform">Plataforma</option><option value="drive">Unidad</option><option value="recent">Últimos lanzados</option></select></div></section>
    <div class="library-heading"><p id="counter"></p><p id="view-label" class="muted">Iconos grandes</p></div>
    <section id="library" class="library icons" aria-live="polite"></section>
  </main>
  <template id="card-template"><article class="game-item"><div class="cover"><span class="cover-initial">G</span><span class="cover-stars">✦✦</span></div><div class="game-main"><p class="platform"></p><h3></h3><p class="status"></p><p class="location"></p><div class="tag-list"></div></div><div class="actions"><button class="icon-button favorite" title="Marcar favorito">☆</button><button class="icon-button edit" title="Editar etiquetas">Editar</button><button class="button play">Jugar</button></div></article></template>
  <dialog id="notice"><p></p><button class="button primary">Entendido</button></dialog>
  <dialog id="editor"><form method="dialog"><h2 id="editor-title">Ficha del juego</h2><label>Etiquetas<input id="tags-input" type="text" placeholder="simracing, pendiente, cooperativo" autocomplete="off"></label><div class="editor-grid"><label>Estado<select id="progress-input"><option>Pendiente</option><option>Jugando</option><option>Completado</option><option>Abandonado</option></select></label><label>Puntuación<select id="rating-input"><option value="0">Sin puntuar</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></label></div><label>Notas<textarea id="notes-input" rows="4" placeholder="Notas personales, objetivos, mods o pendientes…"></textarea></label><label>Portada local<input id="cover-input" type="file" accept="image/png,image/jpeg,image/webp"></label><fieldset><legend>Lanzamiento personalizado opcional</legend><div class="editor-grid"><select id="launch-type"><option value="">Usar detección automática</option><option value="uri">URI de launcher</option><option value="file">Archivo ejecutable</option><option value="appsFolder">AppsFolder de Microsoft</option></select><input id="launch-target" type="text" placeholder="Ruta o URI"></div></fieldset><div class="dialog-actions"><button value="cancel" class="button">Cancelar</button><button id="save-tags" value="default" class="button primary">Guardar</button></div></form></dialog>
  <script src="/app.js"></script>
</body></html>
