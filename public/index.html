<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Games Meta Launcher</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main>
    <header class="hero"><div><p class="eyebrow">PLAYER ONE · BIBLIOTECA LOCAL</p><h1>GAMES<br><span>META LAUNCHER</span></h1><p id="last-update">Cargando inventario…</p></div><div class="coin" aria-hidden="true">★</div></header>
    <section class="command-bar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar juego, etiqueta o plataforma…"></label><button id="refresh" class="button primary">↻ Actualizar ahora</button></section>
    <section class="filters"><h2>Filtros</h2><div id="platforms" class="chips"></div><div id="statuses" class="chips"></div><label class="check"><input id="favorites-only" type="checkbox"> ★ Favoritos</label><select id="tag"><option value="">Todas las etiquetas</option></select><select id="drive"><option value="">Todas las unidades</option></select><select id="sort"><option value="name">Nombre (A–Z)</option><option value="platform">Plataforma</option><option value="drive">Unidad</option><option value="recent">Últimos lanzados</option></select></section>
    <p id="counter" class="counter"></p><section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <template id="card-template"><article class="game-card"><div class="cover"><span class="cover-initial">G</span><span class="cover-stars">✦✦</span></div><div class="card-main"><p class="platform"></p><h3></h3><p class="status"></p><p class="location"></p><div class="tag-list"></div></div><div class="actions"><button class="icon-button favorite" title="Marcar favorito">☆</button><button class="icon-button edit" title="Editar etiquetas">✎</button><button class="button play">▶ Jugar</button></div></article></template>
  <dialog id="notice"><p></p><button class="button primary">Entendido</button></dialog>
  <dialog id="editor"><form method="dialog"><h2 id="editor-title">Etiquetas</h2><p>Separalas con comas: por ejemplo, <em>simracing, pendiente, cooperativo</em>.</p><input id="tags-input" type="text" autocomplete="off"><div class="dialog-actions"><button value="cancel" class="button">Cancelar</button><button id="save-tags" value="default" class="button primary">Guardar</button></div></form></dialog>
  <script src="/app.js"></script>
</body></html>
